server:
  host: "0.0.0.0"
  port: 8080

postgres:
  host: "localhost"
  port: 5432
  user: "ratelimiter"
  password: "secret"
  database: "ratelimiter"
  max_connections: 20

redis:
  addr: "localhost:6379"
  pool_size: 10
  timeout: "1s"

cache:
  tenant_ttl: "5m"
  profile_ttl: "5m"

quotas:
  default_max_profiles: 10
  default_max_requests_per_day: 10000

circuit_breaker:
  enabled: true
  failure_threshold: 5
  timeout: "10s"
  half_open_max_requests: 3

logging:
  level: "info"
  format: "json"
